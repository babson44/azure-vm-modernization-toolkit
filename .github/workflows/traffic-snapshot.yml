name: Traffic snapshot

# Records GitHub's own repo Traffic (views + clones) into CSVs every day so the
# 14-day window in the Insights > Traffic tab is preserved as long-term history.
# No telemetry, no customer machines involved - this only reads GitHub's own numbers.

on:
  schedule:
    - cron: "17 3 * * *"   # daily at 03:17 UTC
  workflow_dispatch:        # allow a manual run from the Actions tab

permissions:
  contents: write           # needed to commit the updated CSVs

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch traffic and merge into history
        env:
          # The built-in GITHUB_TOKEN can read this repo's traffic. If you ever move
          # this workflow or hit a permission error, create a fine-grained PAT with
          # "Administration: read" and save it as a repo secret named TRAFFIC_TOKEN.
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p metrics
          api="https://api.github.com/repos/$REPO/traffic"
          hdr_auth="Authorization: Bearer $GH_TOKEN"
          hdr_acc="Accept: application/vnd.github+json"
          curl -sf -H "$hdr_auth" -H "$hdr_acc" "$api/views"  > views.json
          curl -sf -H "$hdr_auth" -H "$hdr_acc" "$api/clones" > clones.json
          python3 .github/scripts/merge_traffic.py views  views.json  metrics/traffic-views.csv
          python3 .github/scripts/merge_traffic.py clones clones.json metrics/traffic-clones.csv
          rm -f views.json clones.json

      - name: Commit updated metrics
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/traffic-views.csv metrics/traffic-clones.csv
          if git diff --cached --quiet; then
            echo "No traffic changes to commit."
          else
            git commit -m "chore: traffic snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
